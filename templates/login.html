<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="{{ panel_theme }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ panel_name }} — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
       background: {{ '#0f1117' if panel_theme == 'dark' else '#f0f2f5' }}; }
.login-card { width: 100%; max-width: 400px; border-radius: 16px; border: none;
              box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.login-header { border-radius: 16px 16px 0 0; background: {{ panel_color }}; padding: 2rem; text-align: center; }
.btn-accent { background: {{ panel_color }}; border-color: {{ panel_color }}; color: #fff; }
.btn-accent:hover { filter: brightness(1.15); color: #fff; }
</style>
</head>
<body>
<div class="login-card card">
  <div class="login-header">
    <i class="fas fa-shield-alt fa-3x mb-2 text-white opacity-90"></i>
    <h4 class="text-white mb-0 fw-bold">{{ panel_name }}</h4>
    <small class="text-white opacity-75">Gerenciador SSH</small>
  </div>
  <div class="card-body p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Usuário</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" name="username" class="form-control form-control-lg" placeholder="admin" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="btn btn-accent btn-lg w-100 fw-semibold">
        <i class="fas fa-sign-in-alt me-2"></i>Entrar
      </button>
    </form>

    <hr class="my-3">
    <div class="text-center">
      <a href="{{ url_for('user_login') }}" class="text-muted small">
        <i class="fas fa-user-clock me-1"></i>Verificar validade / Renovar acesso
      </a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
