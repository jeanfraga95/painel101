<!-- Create User Modal -->
<div class="modal fade" id="createUserModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-user-plus me-2" aria-hidden="true"></i>Criar Usuário SSH</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Usuário</label>
            <div class="input-group">
              <input type="text" id="cu_username" class="form-control" placeholder="usuario123" required>
              <button class="btn btn-outline-secondary" onclick="genCreds()" title="Gerar aleatório" aria-label="Gerar aleatório">
                <i class="fas fa-random" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Senha</label>
            <input type="text" id="cu_password" class="form-control" placeholder="mín. 5 caracteres" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Dias de validade</label>
            <input type="number" id="cu_days" class="form-control" value="30" min="1" max="365">
          </div>
          <div class="col-md-4">
            <label class="form-label">Limite de conexões</label>
            <input type="number" id="cu_limit" class="form-control" value="1" min="1">
          </div>
          <div class="col-md-4">
            <label class="form-label">Categoria <span class="text-danger">*</span></label>
            <select id="cu_category" class="form-select" required>
              <option value="">— Selecione a categoria —</option>
              {% if categories is defined %}
                {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endfor %}
              {% endif %}
            </select>
            <div class="invalid-feedback">Selecione uma categoria.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Telefone do cliente <span class="text-muted fw-normal">(opcional)</span></label>
            <input type="tel" id="cu_telefone" class="form-control" placeholder="(00) 00000-0000">
          </div>
          <div class="col-md-6">
            <div class="form-check form-switch mt-4 pt-2">
              <input class="form-check-input" type="checkbox" id="cu_v2ray" onchange="toggleUUID(this)">
              <label class="form-check-label" for="cu_v2ray">Habilitar V2Ray/Xray</label>
            </div>
          </div>
          <div class="col-12" id="cu_uuid_wrap" style="display:none">
            <label class="form-label">UUID V2Ray</label>
            <div class="input-group">
              <input type="text" id="cu_uuid" class="form-control font-monospace" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
              <button class="btn btn-outline-secondary" onclick="genUUID()" aria-label="Gerar UUID aleatório" title="Gerar UUID aleatório"><i class="fas fa-random" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" id="btnCreateUser" class="btn btn-primary" onclick="submitCreateUser()">
          <i class="fas fa-plus me-2" aria-hidden="true"></i>Criar Usuário
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Result Modal -->
<div class="modal fade" id="resultModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h6 class="modal-title"><i class="fas fa-check-circle me-2" aria-hidden="true"></i>Criado com sucesso!</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label small text-muted mb-1">
          <i class="fas fa-pen me-1" aria-hidden="true"></i>Edite a mensagem antes de enviar ao cliente
        </label>
        <textarea id="resultMsg" class="form-control font-monospace" rows="10" spellcheck="false"></textarea>
        <input type="hidden" id="resultPhone">
      </div>
      <div class="modal-footer">
        <div class="d-flex gap-2 w-100 mb-2">
          <button type="button" class="btn btn-success flex-fill" id="copyResultBtn"
                  onclick="copyResult(this)">
            <i class="fas fa-copy me-2" aria-hidden="true"></i>Copiar
          </button>
          <a class="btn btn-outline-success flex-fill" id="waResultBtn" href="#" target="_blank" rel="noopener">
            <i class="fab fa-whatsapp me-2" aria-hidden="true"></i>WhatsApp
          </a>
        </div>
        <div class="d-flex gap-2 w-100">
          <button type="button" class="btn btn-outline-secondary flex-fill" onclick="openMsgTpl()">
            <i class="fas fa-cog me-2" aria-hidden="true"></i>Formato
          </button>
          <button type="button" class="btn btn-secondary flex-fill" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Message Template Modal -->
<div class="modal fade" id="msgTplModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title"><i class="fas fa-cog me-2" aria-hidden="true"></i>Formato da mensagem</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-2">
          Monte a mensagem do seu jeito. Os campos abaixo são substituídos pelos dados
          reais na hora de gerar; <strong>linhas cujos campos ficarem vazios são removidas</strong>.
        </p>
        <div class="mb-2" id="tplChips"></div>
        <textarea id="msgTplText" class="form-control font-monospace" rows="10" spellcheck="false"></textarea>
      </div>
      <div class="modal-footer justify-content-between">
        <button type="button" class="btn btn-outline-warning" onclick="restoreMsgTpl()">
          <i class="fas fa-rotate-left me-1" aria-hidden="true"></i>Restaurar padrão
        </button>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-grad" onclick="saveMsgTpl()">
            <i class="fas fa-save me-1" aria-hidden="true"></i>Salvar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let lastResultText = '';
let lastResultVars = null;

// ── Formato da mensagem (salvo por revenda) ────────────────────────────────
const DEFAULT_MSG_TPL =
`👤 Usuário: {usuario}
🔐 Senha: {senha}
⏱️ Duração: {duracao}h
📅 Validade: {validade}
📱 Telefone: {telefone}
🔢 Limite: {limite} conexões
🆔 UUID: {uuid}
🔗 App: {app}`;

let MSG_TPL = {{ (msg_template or '')|tojson }};
const MSG_FIELDS = ['usuario', 'senha', 'duracao', 'validade', 'telefone', 'limite', 'uuid', 'app'];

function effectiveTpl() { return (MSG_TPL && MSG_TPL.trim()) ? MSG_TPL : DEFAULT_MSG_TPL; }

// Substitui os campos e remove linhas cujos campos ficaram vazios.
function renderMsgTpl(vars) {
  const EMPTY = '\u0000';
  let s = effectiveTpl();
  MSG_FIELDS.forEach(k => {
    const v = vars[k];
    const val = (v === undefined || v === null || v === '') ? EMPTY : String(v);
    s = s.split('{' + k + '}').join(val);
  });
  s = s.split('\n').filter(line => line.indexOf(EMPTY) === -1).join('\n');
  s = s.split(EMPTY).join('');
  return s.trim();
}

function _insertAtCursor(ta, text) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.focus();
}

function openMsgTpl() {
  const chips = document.getElementById('tplChips');
  if (chips && !chips.dataset.built) {
    MSG_FIELDS.forEach(k => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-sm btn-outline-info me-1 mb-1';
      b.textContent = '{' + k + '}';
      b.onclick = () => _insertAtCursor(document.getElementById('msgTplText'), '{' + k + '}');
      chips.appendChild(b);
    });
    chips.dataset.built = '1';
  }
  document.getElementById('msgTplText').value = effectiveTpl();
  bootstrap.Modal.getOrCreateInstance(document.getElementById('msgTplModal')).show();
}

function saveMsgTpl() {
  const tpl = document.getElementById('msgTplText').value;
  apiPost('/users/message-template', { template: tpl }, d => {
    showToast(d.message, d.success ? 'success' : 'danger');
    if (!d.success) return;
    MSG_TPL = d.template || '';
    refreshResultMsg();
    if (typeof refreshCredMsg === 'function') refreshCredMsg();
    bootstrap.Modal.getInstance(document.getElementById('msgTplModal'))?.hide();
  });
}

async function restoreMsgTpl() {
  if (!await confirmDialog('Voltar a mensagem para o formato padrão?')) return;
  document.getElementById('msgTplText').value = DEFAULT_MSG_TPL;
  apiPost('/users/message-template', { template: '' }, d => {
    showToast(d.message, d.success ? 'success' : 'danger');
    if (!d.success) return;
    MSG_TPL = '';
    refreshResultMsg();
    if (typeof refreshCredMsg === 'function') refreshCredMsg();
    bootstrap.Modal.getInstance(document.getElementById('msgTplModal'))?.hide();
  });
}

function refreshResultMsg() {
  const ta = document.getElementById('resultMsg');
  if (!ta || !lastResultVars) return;
  lastResultText = renderMsgTpl(lastResultVars);
  ta.value = lastResultText;
  const wa = document.getElementById('waResultBtn');
  if (wa) {
    const phone = document.getElementById('resultPhone').value || '';
    const wl = () => waLink(phone, ta.value);
    wa.href = wl();
    ta.oninput = () => { wa.href = wl(); };
  }
}

// Monta o link do WhatsApp (com o telefone do cliente, se houver) já com o
// texto editado — assim o revendedor só revisa e aperta enviar.
function waLink(phone, text) {
  const digits = (phone || '').replace(/\D/g, '');
  return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text || '');
}

function toggleUUID(cb) {
  document.getElementById('cu_uuid_wrap').style.display = cb.checked ? 'block' : 'none';
  if (cb.checked) genUUID();
}

function genUUID() {
  fetch('/api/random_credentials').then(r=>r.json()).then(d => {
    document.getElementById('cu_uuid').value = d.uuid;
  });
}

function genCreds() {
  fetch('/api/random_credentials').then(r=>r.json()).then(d => {
    document.getElementById('cu_username').value = d.username;
    document.getElementById('cu_password').value = d.password;
  });
}

function genTestCreds() {
  fetch('/api/random_credentials').then(r=>r.json()).then(d => {
    document.getElementById('ct_username').value = 'tst_' + d.username.slice(3);
    document.getElementById('ct_password').value = d.password;
  });
}

function showResult(data) {
  const appLink = data.app_link || '';
  // Dados reais deste usuário — viram os valores dos campos do formato.
  lastResultVars = {
    usuario:  data.username   || '',
    senha:    data.password   || '',
    duracao:  data.hours      || '',
    validade: data.expires_at || '',
    telefone: data.telefone   || '',
    limite:   data.limit      || '',
    uuid:     data.uuid       || '',
    app:      appLink,
  };

  document.getElementById('resultPhone').value = data.telefone || '';
  refreshResultMsg();

  // Fecha o modal de criação COMPLETAMENTE antes de abrir o de resultado.
  // Abrir o novo modal durante a animação de fechamento deixava um backdrop
  // "fantasma" (transparente) por cima do modal de criação.
  const createEl = document.getElementById('createUserModal');
  const testEl   = document.getElementById('createTestModal');
  const create   = bootstrap.Modal.getInstance(createEl);
  const test     = bootstrap.Modal.getInstance(testEl);
  const res      = bootstrap.Modal.getOrCreateInstance(document.getElementById('resultModal'));

  const openSrc = (create && create._isShown) ? createEl
                : (test   && test._isShown)   ? testEl : null;

  if (create) create.hide();
  if (test)   test.hide();

  if (openSrc) {
    openSrc.addEventListener('hidden.bs.modal', function h() {
      openSrc.removeEventListener('hidden.bs.modal', h);
      res.show();
    }, { once: true });
  } else {
    res.show();
  }
}

function copyResult(btnEl) {
  universalCopy(document.getElementById('resultMsg').value, btnEl);
}

// pmCopy removed — universalCopy (defined in base.html) handles all cases including HTTP + modal focus-trap

// Auto-seleciona categoria se houver apenas uma disponível
function autoSelectCategory(selectId) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const opts = [...sel.options].filter(o => o.value !== '');
  if (opts.length === 1) {
    sel.value = opts[0].value;
  }
}

function _setBtnLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (loading) {
    btn.disabled = true;
    btn._origHtml = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Criando...';
  } else {
    btn.disabled = false;
    if (btn._origHtml) btn.innerHTML = btn._origHtml;
  }
}

function submitCreateUser() {
  const catEl = document.getElementById('cu_category');
  if (!catEl.value) {
    catEl.classList.add('is-invalid');
    catEl.focus();
    return;
  }
  catEl.classList.remove('is-invalid');
  const v2 = document.getElementById('cu_v2ray').checked;
  _setBtnLoading('btnCreateUser', true);
  apiPost('/users/create', {
    username:    document.getElementById('cu_username').value,
    password:    document.getElementById('cu_password').value,
    days:        document.getElementById('cu_days').value,
    limit:       document.getElementById('cu_limit').value,
    category_id: catEl.value,
    use_v2ray:   v2 ? '1' : '0',
    uuid:        v2 ? document.getElementById('cu_uuid').value : '',
    telefone:    document.getElementById('cu_telefone').value,
  }, d => {
    _setBtnLoading('btnCreateUser', false);
    if (d.success) showResult(d.user);
    else showToast(d.message, 'danger');
  }, () => {
    _setBtnLoading('btnCreateUser', false);
    showToast('Erro de conexão ao criar usuário', 'danger');
  });
}

function submitCreateTest() {
  const catEl = document.getElementById('ct_category');
  if (!catEl.value) {
    catEl.classList.add('is-invalid');
    catEl.focus();
    return;
  }
  catEl.classList.remove('is-invalid');
  const v2 = document.getElementById('ct_v2ray').checked;
  _setBtnLoading('btnCreateTest', true);
  apiPost('/users/test', {
    username:    document.getElementById('ct_username').value,
    password:    document.getElementById('ct_password').value,
    hours:       document.getElementById('ct_hours').value,
    limit:       document.getElementById('ct_limit').value,
    category_id: catEl.value,
    use_v2ray:   v2 ? '1' : '0',
    telefone:    document.getElementById('ct_telefone').value,
  }, d => {
    _setBtnLoading('btnCreateTest', false);
    if (d.success) showResult(d.user);
    else showToast(d.message, 'danger');
  }, () => {
    _setBtnLoading('btnCreateTest', false);
    showToast('Erro de conexão ao criar teste', 'danger');
  });
}

// Ao abrir os modais, auto-seleciona categoria se houver apenas uma
document.getElementById('createUserModal')?.addEventListener('shown.bs.modal', () => autoSelectCategory('cu_category'));
document.getElementById('createTestModal')?.addEventListener('shown.bs.modal', () => autoSelectCategory('ct_category'));
</script>
